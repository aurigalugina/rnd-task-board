services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rndops
      POSTGRES_PASSWORD: rndops
      POSTGRES_DB: rndops
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgres://rndops:rndops@postgres:5432/rndops?sslmode=disable
      JWT_SECRET: dev-secret-change-me
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      - postgres
    expose:
      - "8080"

  nginx:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
  uploads:
