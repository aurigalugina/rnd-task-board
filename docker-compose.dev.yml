# Versi DEV (hot-reload) — beda dari docker-compose.yml (versi build/prod:
# multi-stage Dockerfile, output statis, nginx). Di sini source code di-mount
# langsung (bind mount) supaya ubahan di host langsung kepakai tanpa rebuild
# image:
#   - backend: `air` watch file .go, auto rebuild+restart binary
#   - frontend: vite dev server asli (HMR), bukan build statis
# Project name di-set beda ("rndops-dev") biar volume/network-nya kepisah
# dari stack docker-compose.yml biasa, gak collide/ketimpa network default.
name: rndops-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rndops
      POSTGRES_PASSWORD: rndops
      POSTGRES_DB: rndops
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    environment:
      DATABASE_URL: postgres://rndops:rndops@postgres:5432/rndops?sslmode=disable
      JWT_SECRET: dev-secret-change-me
      PORT: "8080"
      UPLOAD_DIR: /app/uploads
      # myagenda-service itu sub-project TERPISAH (compose/network sendiri,
      # lihat myagenda-service/docker-compose.yml) -- dijangkau lewat host,
      # bukan nama service docker (beda docker network). Kosongkan/comment
      # kalau myagenda-service lagi tidak dijalankan (Push tetap jalan
      # normal, cuma skip sinkron HR -- best-effort, lihat decision log).
      MYAGENDA_SERVICE_URL: http://host.docker.internal:8090
      # claude-chat-service (Vision §6, sub-project TERPISAH) — diproksikan
      # backend lewat /api/v1/chat/* (Opsi B, lihat
      # decision-log-change-request-integration-20260811.md). Dijangkau lewat
      # host (beda network, seperti myagenda). PORT 8091 sengaja BEDA dari
      # myagenda (8090) supaya tidak tabrakan kalau dua-duanya jalan di host —
      # jalankan service dengan `PORT=8091 npm start`. Kosong/mati = fitur chat
      # 502 (graceful), fitur lain tetap normal.
      CLAUDE_CHAT_SERVICE_URL: http://host.docker.internal:8091
      # Direktori default yang di-point sesi chat (path di HOST tempat
      # claude-chat-service jalan) — user tetap bisa ganti via dir picker.
      CHAT_DEFAULT_CWD: /home/lugidev/rnd-task-board
    volumes:
      - ./backend:/app
      - go_mod_cache:/go/pkg/mod
      - backend_air_tmp:/app/tmp
      - uploads_dev:/app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres
    ports:
      - "8080:8080"

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host --port 5173"
    environment:
      VITE_API_PROXY_TARGET: http://backend:8080
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  pgdata_dev:
  uploads_dev:
  go_mod_cache:
  backend_air_tmp:
  frontend_node_modules:
