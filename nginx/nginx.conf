server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SSE (text/event-stream) endpoints -- terutama /api/v1/chat/auth/setup-token
    # (provisioning OAuth Claude, lihat claude-chat-service/README.md) -- HARUS
    # didefinisikan SEBELUM location /api/ umum karena nginx pakai longest-prefix-
    # match tapi kita tetap taruh lebih spesifik duluan untuk kejelasan. Tanpa
    # proxy_buffering off, nginx menahan seluruh response sampai selesai/close
    # sebelum diteruskan ke client -- client (browser/curl) terlihat "stuck
    # menunggu output" tanpa timeout sampai backend menutup koneksi.
    location /api/v1/chat/ {
        proxy_pass http://backend:8080/api/v1/chat/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;
        # Provisioning OAuth butuh browser manual login (bisa bermenit-menit) --
        # default nginx read timeout (60s) akan memutus SSE sebelum user sempat
        # approve & authorization code dikirim balik lewat request terpisah.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # WebSocket chat (/api/v1/chat/ws/...) butuh Upgrade header diteruskan.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

