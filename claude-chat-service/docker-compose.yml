# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-go/master/schema/compose-spec.json
services:
  claude-chat-service:
    build: .
    ports:
      - "8090:8090"
    environment:
      PORT: "8090"
      # Diisi otomatis lewat POST /auth/setup-token (lihat auth/tokenStore.ts) —
      # biasanya TIDAK perlu di-set manual di sini.
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
    volumes:
      # Token store persist lintas restart container.
      - claude-chat-data:/app/data
      # Direktori project yang mau bisa di-"pointing" dari client HARUS
      # dimount ke sini juga — lihat README "Catatan Docker & filesystem".
      # - /path/di/host/ke/project:/workspaces/project

volumes:
  claude-chat-data:
