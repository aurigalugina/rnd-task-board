# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-go/master/schema/compose-spec.json
#
# Setup awal (sekali saja):
#   docker compose up -d --build
#   docker compose exec claude-chat-service claude auth login
# Setelah login, credentials persist di named volume 'claude-credentials'.
services:
  claude-chat-service:
    build: .
    ports:
      - "${PORT:-8091}:${PORT:-8091}"
    environment:
      PORT: "${PORT:-8091}"
      CHAT_DEFAULT_CWD: "${CHAT_DEFAULT_CWD:-/opt/rnd-task-board}"
    volumes:
      # Token store service (hasil POST /auth/setup-token)
      - claude-chat-data:/app/data
      # Credentials claude CLI — persist lintas restart container.
      # Isi via: docker compose exec claude-chat-service claude auth login
      - claude-credentials:/root/.claude
      # Mount direktori project dari host (path harus identik dengan CHAT_DEFAULT_CWD)
      - "${CHAT_DEFAULT_CWD:-/opt/rnd-task-board}:${CHAT_DEFAULT_CWD:-/opt/rnd-task-board}:ro"

volumes:
  claude-chat-data:
  claude-credentials:
