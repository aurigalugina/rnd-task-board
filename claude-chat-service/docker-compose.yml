# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-go/master/schema/compose-spec.json
#
# Untuk deployment server: salin .env.example ke .env, isi CHAT_DEFAULT_CWD,
# lalu jalankan: docker compose up -d --build
#
# Kredensial Claude dibaca langsung dari ~/.claude di host (mount read-only) —
# tidak perlu copy/paste token manual. Pastikan user di host sudah login
# via `claude auth login` sebelum menjalankan service ini.
services:
  claude-chat-service:
    build: .
    ports:
      - "${PORT:-8091}:${PORT:-8091}"
    environment:
      PORT: "${PORT:-8091}"
      CHAT_DEFAULT_CWD: "${CHAT_DEFAULT_CWD:-/opt/rnd-task-board}"
    volumes:
      # Token store persist lintas restart container.
      - claude-chat-data:/app/data
      # Kredensial Claude dari host — service baca OAuth token langsung
      # dari sini tanpa perlu copy/paste manual.
      - ~/.claude:/root/.claude:ro
      # Mount direktori project dari host (path harus identik dengan
      # CHAT_DEFAULT_CWD supaya path yang dikirim client valid di dalam container).
      - "${CHAT_DEFAULT_CWD:-/opt/rnd-task-board}:${CHAT_DEFAULT_CWD:-/opt/rnd-task-board}:ro"

volumes:
  claude-chat-data:
